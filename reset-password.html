<body class="auth-page" data-page="reset-password">
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="ambient ambient-c"></div>
<main class="auth-page-shell">
  <a class="auth-brand-lockup" href="login.html" aria-label="Berry Vibes CCD sign in">

    <span class="auth-brand-copy"><strong>BERRY VIBES</strong><small>COZY CORE DIET · CCD</small></span>
